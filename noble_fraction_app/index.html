<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b1020">
    <title>Noble Fraction</title>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="ui/styles.css">
    <script>
        // The chosen look (?skin=… or the saved setting) is applied here, before first paint, so there is no flash of the classic look.
        (function () {
            var ids = ['control-room', 'blueprint', 'field-manual'], id = null;
            try { id = new URLSearchParams(location.search).get('skin') || JSON.parse(localStorage.getItem('noble-fraction.settings.v1') || '{}').skin; } catch (e) { /* no storage */ }
            if (ids.indexOf(id) < 0) return;
            document.documentElement.dataset.skin = id;
            [['skin-fonts', 'ui/fonts/fonts.css'], ['skin-base', 'ui/skins/_base.css'], ['skin-css', 'ui/skins/' + id + '.css']].forEach(function (x) {
                var l = document.createElement('link'); l.rel = 'stylesheet'; l.id = x[0]; l.href = x[1]; document.head.appendChild(l);
            });
        })();
    </script>
</head>
<body>
    <div id="rotate" role="alert"><div><div class="rotate-icon">&#x21BB;</div>Rotate your phone to landscape</div></div>
    <div id="app"></div>
    <div id="overlay"></div>
    <div id="fx" aria-hidden="true"><div id="toasts"></div></div>
    <script type="module" src="ui/main.js"></script>
</body>
</html>
